[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-risk-posture-model"
version = "0.1.0"
description = "Reproducible reference implementation and validation scaffolding for the Cyber Risk Metric paper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["models*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
